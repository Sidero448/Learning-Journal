<!DOCTYPE html>

        <title>Media Tags</title>

    <body>
        <audio controls loop muted> <!--ses dosyası oynatmak için gerekli olan etikettir.Controls niteliği ile 
                             ses dosyasını çalmak için gerekli olan paneli getiririz.Loop niteliği ile ses 
                             dosyası bittiğinde başa sarıp tekrardan başlar.muted niteliği ise manuel olarak
                             ses dosyasının sesi açılana tek sesinin 0 da kalmasını/ses dosyasının 
                             susturulmasını sağlar.-->
            <source src="E:\Coding\Learning\Learning journal\Rinnegan Sound Effect.mp3" type="audio/mpeg">
        </audio>
        <!--Normal şartlarda controls niteliğine ihtiyaç yok çünkü javascript ile daha iyi ses dosyası
            çalma panelleri oluşturabileceğiz.-->

        <!--Video etiketi ile video oynatabiliriz.Audio etiketinde kullanılan nitelikler video etiketindede 
        kullanılabilir.Width/Height niteliği ile videonun formatı değiştirilebilir.-->

</html>
