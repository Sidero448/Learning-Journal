<!doctype html>
<html lang="tr">


  <head>

    <meta charset="utf-8" />
    <title>Iframe Tag</title>

  </head>


  <body>

    <a href="https://www.w3.org" target="iframe">World Wibe Web Consortium</a>
    <a href="https://www.amazon.com" target="iframe">Amazon</a>
    <a href="https://wikipedia.org/wiki/Vikipedi" target="iframe">Wikipedia</a>

    <br /><br /><br />

    <iframe name="iframe" src="https://wikipedia.org" height="300" width="300"></iframe>
    <!-- iframe etiketi ile başka bir sitenin küçük önizlemesini kendi sitemize ekleyebiliriz. eğer eklediğimiz linklerde target niteliği olarak bu
      iframe i seçersek linkler iframe bölmesinin içinde açılır fakat çoğu site açılmaz pek sağlıklı bir yöntem değil zaten site açmak için.
      ama etiket önemli içinde youtube videoları bile açılabilir.site içinde linkleri küçük bir bölmede göstermek için kullanılabilir.eğer 
      iframe etiketinin içine "sandbox" niteliği eklenirse açılan küçük sitedeki tüm javascript kodları popuplar vs. engellenir sandbox niteliğine 
      de nitelik yazarak sadece belli başlı şeylere izin verilebilir örneğin form göndermeye izin verilir ama popuplara izin verilmez gibi gibi.
      Kısaca bu iframe özelliği sitenin içinde küçük başka bir site gibi yorumlanabilir.-->


  </body>

</html>
