<!DOCTYPE html>

<html lang="tr">
    <head>
        <meta charset="utf-8">


        <title>Text Formatting Tags</title>

    </head>
    <body>
          <p>
            <div>Ben <b>Sidero</b>448 </div><!-- burada "Sidero" kelimesi sadece kalın olacaktır.-->
            <div>Ben <strong>Sidero</strong>448 </div> <!-- burada ise "Sidero" kelimesinin hem önemli olduğu
                                                            vurgulandı hemde "Sidero" kelimesi kalın oldu.-->
        </p>
        <p>
            <div>Ben <i>Sidero</i>448 </div> <!-- Burada "Sidero" kelimesi italic fontta eğik duruyor.-->
            <div>Ben <em>Sidero</em>448 </div> <!-- burada ise "Sidero" kelimesinin hem önemli olduğu 
                                                    vurgulandı hemde "Sidero" kelimesi italic oldu.-->
        </p>
        <p>
            <div>Ben <mark>Sidero</mark>448 </div> <!-- Burada "Sidero" kelimesinin üstünden kalemle geçilmiş 
                                                        gibi işaretlendi-->
        </p>
        <p>
            <div>Ben <small>Küçük Sidero</small></div> <!--Burada "Sidero" kelimesi cümledeki
                                                                diğer kelimelere kıyasla daha küçük duruyor-->
        </p>
        <p>
            <div>Ben <u>Sdiro</u>448</div> <!--Burada "Sidero" olarak yazılmış olması gereken kelime 
                                                   "Sdiro" diye yanlış bir şekilde yazıldığı için
                                                    altı çizildi-->
        </p>
        <p>
            <div>Ben <s>110</s> kiloyum</s> 70 kiloyum.</div> <!-- bu yazıda artık 110 kilo olunmadığı,70 kiloya 
                                                            düşüldüğü ve artık 110 kilo olma durumunun
                                                            doğru olmadığını göstermek için "110 kiloyum"
                                                            cümlesinin üstüne bir çizgi çekildi-->
        </p> 
        <p>
            <div>ben <s>110 kiloyum</s> <u>70 kiloyum</u></div> <!--bu yazıda artık 110 kilo olunmadığı,70 kiloya 
                                                            düşüldüğü ve artık 110 kilo olma durumunun
                                                            doğru olmadığını göstermek için "110 kiloyum"
                                                            cümlesinin üstüne bir çizgi çekildi ve 70 kilo
                                                            olma durumunun 110 kilo olma durumunun yerini alması
                                                            yüzünden "70 kiloyum cümlesinin altına bir çizgi çekildi"-->
        </p>
        <p>
            <div>Motorumu bugüne özel <del>120.000 TL</del> yerine <ins>96.000 TL</ins>'ye satıyorum</div>
            <!-- yukarda kilo değişim durumunda yapılan manuel etiketler yerine del ve ins etiketleri
             kullanılarak değişken ve değişkenin yerine geçen şey daha iyi belirtildi-->
        </p>
        <p>
            <div>H<sub>2</sub>O ,Su elementidir</div>  <!--sub etiketi sayesinde 2 aşşağıda duruyor ve 
                                                            su elementi düzgün bir şekilde gösterilmiş
                                                            olunuyor.-->
        </p>
        <p>
            <div>10<sup>2</sup> = 100 eder.</div> <!--sup etiketi sayesinde 2 üslü sayı olarak gösteriliyor-->
        </p>
    </body>
</html>
