<!DOCTYPE html>

<html lang="tr">
    <head>
        <meta charset="utf-8">


        <title>Blocks,İnlines,Paragraphs and Titles.</title>

    </head>
    <body>
         <div> <!-- block mantığını temsil eden etiketlerden birisidir.Block yeni satır 
                başlatır.-->

            <div>Sidero448</div>

            <span>Sidero448</span> <br> <!--inline mantığını temsil eden etiketlerden birisidir.
                                    İnline bulunduğu satırda devam eder.-->

            Ben Sidero448<br> 
            *alt satır*
            <!-- br alt satıra geçmek için olan bir etikettir.Aynı enter ile yeni bir satır açmak gibi.-->

        </div>

        <p> <!-- paragraf etiketidir.Paragraf yazılarında bu etiket kullanılır.-->
            burası benim paragrafım
        </p>

        <p>
            burası benim 2. paragrafım
        </p>

        <h1>Başlıklar</h1> <!--<h1> başlıkları belirtmek için kullanılır toplam 6 tane 
                            başlık vardır en önemli başlıktan en önemsiz başlığa doğru 
                            sıralanır.Yani <h1> en önemli başlıktır,<h6> en önemsiz başlıktır.-->

        <h1>Başlık</h1> <!-- en önemli başlık.Örn:Sitenin adı-->
        <h2>Başlık</h2>
        <h3>Başlık</h3>
        <h4>Başlık</h4>
        <h5>Başlık</h5>
        <h6>Başlık</h6> <!-- en önemsiz başlık -->

    </body>
</html>
